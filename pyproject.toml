[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-failure-explainer"
version = "0.1.0"
description = "Explain why a GitHub Actions job failed: rule-based first, optional LLM, every reference checked against the log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eren Özgü" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ci-failure-explainer = "ci_failure_explainer.cli:main"

[tool.setuptools.packages.find]
include = ["ci_failure_explainer*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
